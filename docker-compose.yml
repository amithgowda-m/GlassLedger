version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: glassledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glassledger_user
      POSTGRES_PASSWORD: glassledger_password
      POSTGRES_DB: glassledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glassledger_user -d glassledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: glassledger_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
