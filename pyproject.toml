[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassledger"
version = "0.1.0"
description = "Hybrid-persistence paper-trading engine with deterministic replay, crash safety, and trade provenance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "GlassLedger Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "psycopg[binary,pool]>=3.1.18",
    "pymongo>=4.8.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
glassledger = "glassledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/glassledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
